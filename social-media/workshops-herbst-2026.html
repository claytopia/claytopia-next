<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1080px; }
  body {
    background:#FBF8F4;
    font-family:'Montserrat', 'Helvetica Neue', Arial, sans-serif;
    display:flex; flex-direction:column;
  }
  .photo {
    height:560px; width:100%;
    background:url('file:///Users/piakadasch/sources/claytopia-next/public/img/workshops/Tapas-hero.jpg') center 42% / cover no-repeat;
  }
  .content {
    flex:1;
    padding:56px 72px 60px 72px;
    display:flex; flex-direction:column; justify-content:space-between;
    background:#FBF8F4;
  }
  .kicker {
    font-size:20px; font-weight:600; letter-spacing:.22em; text-transform:uppercase;
    color:#B4674A;
  }
  .rule { width:96px; height:3px; background:#B4674A; margin:26px 0 30px 0; }
  h1 {
    font-family:'Playfair Display', Georgia, serif;
    font-size:64px; line-height:76px; font-weight:600; color:#2B2320;
    max-width:900px;
  }
  .footer {
    display:flex; align-items:flex-end; justify-content:space-between; gap:32px;
    border-top:1px solid #E8DED2; padding-top:28px;
  }
  .url { font-size:26px; font-weight:600; color:#4A403B; letter-spacing:.01em; }
  .sub { font-size:19px; color:#8A7A6E; margin-top:8px; }
  .logo { height:58px; width:auto; mix-blend-mode:multiply; }
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="content">
    <div>
      <div class="kicker">Workshops &middot; Herbst 2026</div>
      <div class="rule"></div>
      <h1>Neue Workshoptermine für den Herbst sind online</h1>
    </div>
    <div class="footer">
      <div>
        <div class="url">claytopia.de/workshops</div>
        <div class="sub">Rösrath &middot; Anfragen per Mail oder WhatsApp</div>
      </div>
      <img class="logo" src="file:///Users/piakadasch/sources/claytopia-next/public/img/newsletter-logo.png" alt="" />
    </div>
  </div>
</body>
</html>
